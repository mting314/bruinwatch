[project]
name = "bruinwatch"
version = "2.0.0"
description = "A Discord bot that tracks UCLA class enrollment and notifies you when a watched class opens up."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "discord.py>=2.4",
    "httpx[http2]>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "apscheduler>=3.10,<4",
    "pydantic-settings>=2.3",
    "tenacity>=8.4",
    "structlog>=24.2",
    "aiohttp>=3.9",
]

[project.scripts]
bruinwatch = "bruinwatch.__main__:run"
# Serves the stats site against synthetic data, for development. Needs no
# token, no Postgres and no scraped history.
bruinwatch-demo = "bruinwatch.scripts.demo:main"
# Walks past terms and records their catalogs. Resumable; rate-limited.
bruinwatch-backfill = "bruinwatch.scripts.backfill:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "pytest-aiohttp>=1.0",
    "ruff>=0.5",
    "mypy>=1.10",
    # PGlite: PostgreSQL as WebAssembly, run in-process. Lets the DB-backed
    # tests run with no Docker and no local Postgres -- only Node on PATH.
    "py-pglite>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bruinwatch"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "ASYNC",
    "RUF",
]
ignore = [
    "E501",   # line length is handled by the formatter
    "RUF001", # en-dashes are deliberate in user-facing copy
    "RUF002",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.12"
packages = ["bruinwatch"]
mypy_path = "src"
strict = true
warn_return_any = true
disallow_untyped_decorators = false  # discord.py decorators are untyped

[[tool.mypy.overrides]]
module = ["bs4.*", "apscheduler.*", "py_pglite.*"]
ignore_missing_imports = true

# The Discord-facing layer is checked, but not strictly: discord.py's
# app_commands/ui decorators erase signatures, so demanding full annotations
# there buys noise rather than safety. The pure layers below stay strict.
[[tool.mypy.overrides]]
module = ["bruinwatch.cogs.*", "bruinwatch.ui.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
warn_return_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# One event loop for the whole session. The database fixture holds a single
# pinned connection (PGlite serves only one), which a per-test loop would
# invalidate with "attached to a different loop".
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
# py-pglite ships a pytest plugin we do not use; ours is in tests/postgres.py.
addopts = "-p no:py_pglite.pytest_plugin"
filterwarnings = ["error::DeprecationWarning:bruinwatch.*"]
